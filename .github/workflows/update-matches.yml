name: Update match fixtures

on:
  schedule:
    # 03:15 UTC: picks up everything played the previous evening.
    - cron: "15 3 * * *"
    # 18:15 UTC: picks up the early kick-offs the same day.
    - cron: "15 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch latest fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-matches.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update match fixtures"
            git push
          fi
